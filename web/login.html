<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in - AquaNet</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
<main class="auth-card">
  <a class="brand" href="/login.html"><img src="favicon.svg" alt="" width="34" height="34"><b>Aqua<span>Net</span></b></a>
  <p class="sub">Water Network Operations</p>
  <div class="seg" role="group" aria-label="Choose action">
    <button type="button" id="tabLogin" aria-pressed="true">Sign in</button>
    <button type="button" id="tabReg" aria-pressed="false">Create account</button>
  </div>
  <form id="form" autocomplete="on">
    <label for="u">Username</label>
    <input type="text" id="u" name="username" autocomplete="username" required minlength="3" maxlength="20">
    <label for="p">Password</label>
    <input type="password" id="p" name="password" autocomplete="current-password" required minlength="6">
    <div id="p2wrap" hidden>
      <label for="p2">Confirm password</label>
      <input type="password" id="p2" autocomplete="new-password">
    </div>
    <button type="submit" class="btn" id="go">Sign in</button>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
  </form>
  <p class="hint" id="hint">Residents and staff: create an account to watch the network and report problems. Administrators are set up by the system owner.</p>
</main>
<script src="js/login.js"></script>
</body>
</html>
